name: Notify Docs

on:
  push:
    branches: [main]
    paths: [docs/**]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.VATLY_DOCS_DISPATCH_TOKEN }}
          repository: vatly/vatly-docs
          event-type: sync-fluent-php-docs
